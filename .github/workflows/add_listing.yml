name: Add Candidate Listing via Web

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Candidate Rental Listing URL (e.g. Zillow)'
        required: true
        type: string
      campaign:
        description: 'Search Campaign Slug (leave blank for active campaign)'
        default: ''
        required: false
        type: string
      unit:
        description: 'Optional Unit Number (e.g. Unit 101)'
        required: false
        default: ''
        type: string
      rent:
        description: 'Optional Monthly Rent (e.g. 2950)'
        required: false
        default: ''
        type: string
      beds:
        description: 'Optional Bedroom Count (e.g. 1 or 0 for Studio)'
        required: false
        default: ''
        type: string
      address:
        description: 'Optional Street Address Override'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# Shared with daily_sync.yml and sync_annotations.yml so the data-writing workflows serialize
# instead of racing on main (a textual merge of regenerated JSON can silently
# drop or revert data).
concurrency:
  group: "data-writes"
  cancel-in-progress: false

jobs:
  ingest-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies with uv
        run: |
          uv venv
          uv pip install -e .

      - name: Configure Git Author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest main branch
        run: git pull origin main --rebase

      - name: Resolve campaign
        id: campaign
        env:
          INPUT_CAMPAIGN: ${{ inputs.campaign }}
        run: |
          if [ -n "$INPUT_CAMPAIGN" ]; then
            echo "id=$INPUT_CAMPAIGN" >> "$GITHUB_OUTPUT"
          else
            echo "id=$(bash scripts/active_campaign.sh)" >> "$GITHUB_OUTPUT"
          fi

      # User-typed inputs are passed via env so the shell never interprets them
      # (interpolating ${{ inputs.* }} directly into `run:` allows command injection).
      - name: Ingest & Enrich Listing
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_CAMPAIGN: ${{ steps.campaign.outputs.id }}
          INPUT_UNIT: ${{ inputs.unit }}
          INPUT_RENT: ${{ inputs.rent }}
          INPUT_BEDS: ${{ inputs.beds }}
          INPUT_ADDRESS: ${{ inputs.address }}
        run: |
          source .venv/bin/activate
          ARGS=()
          if [ -n "$INPUT_UNIT" ]; then ARGS+=(--unit "$INPUT_UNIT"); fi
          if [ -n "$INPUT_RENT" ]; then ARGS+=(--rent "$INPUT_RENT"); fi
          if [ -n "$INPUT_BEDS" ]; then ARGS+=(--beds "$INPUT_BEDS"); fi
          if [ -n "$INPUT_ADDRESS" ]; then ARGS+=(--address "$INPUT_ADDRESS"); fi
          python3 -m pipeline.cli add "$INPUT_URL" --campaign "$INPUT_CAMPAIGN" "${ARGS[@]}"
          mkdir -p web/data
          cp web/public/data/campaign_data.json web/data/campaign_data.json

      - name: Commit & Push New Listing
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_CAMPAIGN: ${{ steps.campaign.outputs.id }}
        run: |
          source .venv/bin/activate
          bash scripts/push_data_changes.sh "$INPUT_CAMPAIGN" "feat(ingest): Add listing from $INPUT_URL"
