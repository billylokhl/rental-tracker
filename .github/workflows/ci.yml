name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Pipeline unit tests
        run: |
          source .venv/bin/activate
          python3 -m pytest pipeline/ -q

      - name: Web JS syntax check
        # No bundler in this project, so an ES-module parse of every source file
        # is the floor that catches broken imports/syntax before deploy.
        run: |
          status=0
          while IFS= read -r f; do
            if ! node --input-type=module --check - < "$f"; then
              echo "::error file=$f::JavaScript syntax error in $f"
              status=1
            fi
          done < <(find web/src -name '*.js')
          exit $status

      - name: Campaign bundle build (smoke)
        # Same build the deploy workflow runs; catches data/validator crashes
        # before a push to main takes down the deploy.
        run: |
          source .venv/bin/activate
          CAMPAIGN=$(bash scripts/active_campaign.sh)
          python3 -m pipeline.cli build --campaign "$CAMPAIGN"
