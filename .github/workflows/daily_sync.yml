name: Daily Listing Sync & Refresh

on:
  schedule:
    # Runs daily at 09:15 UTC (02:15 AM Pacific / after midnight)
    - cron: '15 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Shared with add_listing.yml and sync_annotations.yml so all data-writing workflows serialize
concurrency:
  group: "data-writes"
  cancel-in-progress: false

jobs:
  refresh-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Read active campaign
        id: campaign
        run: echo "id=$(bash scripts/active_campaign.sh)" >> "$GITHUB_OUTPUT"

      - name: Refresh Upstream Listings (Preserving User Overrides)
        run: |
          source .venv/bin/activate
          python3 -m pipeline.cli refresh --campaign "${{ steps.campaign.outputs.id }}"
          cp web/public/data/campaign_data.json web/data/campaign_data.json

      - name: Commit and Push Updated Listings
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Sync"
          source .venv/bin/activate
          bash scripts/push_data_changes.sh "${{ steps.campaign.outputs.id }}" "chore(sync): Daily automated upstream listing refresh"
