name: Deploy Rental Tracker to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Deploy concurrency is intentionally separate from the "data-writes" group used by
# add_listing, daily_sync, and sync_annotations. Those workflows serialize commits
# to main; this workflow serializes Pages deployments. Multiple deploy runs may queue
# if rapid pushes occur — that's safe because cancel-in-progress is false, so the
# final deploy always reflects the latest commit.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies with uv
        run: |
          uv venv
          uv pip install -e .

      - name: Read active campaign
        id: campaign
        run: echo "id=$(bash scripts/active_campaign.sh)" >> "$GITHUB_OUTPUT"

      - name: Compile Active Campaign Data Bundle
        run: |
          source .venv/bin/activate
          python3 -m pipeline.cli build --campaign "${{ steps.campaign.outputs.id }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build frontend
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAP_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
        run: npm run build
        working-directory: web

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
